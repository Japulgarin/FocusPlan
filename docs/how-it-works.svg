<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="How FocusPlan works: describe your goal, AI builds the plan, your day block by block, check it off, switch plans and see your progress">
<style>
  text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #e8eaf0; }
  .cap { font-size: 18px; font-weight: 800; } .sub { font-size: 12px; fill: #8b93a7; }
  .lbl { font-size: 11px; font-weight: 700; letter-spacing: .05em; fill: #8b93a7; }
  .body { font-size: 14px; } .strong { font-size: 14px; font-weight: 700; } .tabt { font-size: 13px; font-weight: 700; } .m { fill: #8b93a7; }
  .btn { font-size: 16px; font-weight: 800; fill: #0b1020; } .ai { font-size: 22px; font-weight: 900; fill: #1a1033; }
  .dark { font-size: 14px; font-weight: 800; fill: #12141a; } .dark.s { font-size: 12px; font-weight: 700; }
  .card { fill: #171a21; stroke: #2a2f3a; } .field { fill: #1e222b; stroke: #2a2f3a; } .field.g { stroke: #35d07f; }
  .tabOff { fill: #1e222b; stroke: #2a2f3a; } .tab { fill: #1e222b; stroke: #2a2f3a; } .box { fill: #1e222b; stroke: #8b93a7; stroke-width: 1.5; }
  .cover { fill: #1e222b; transform-box: fill-box; transform-origin: right center; }
  .origin, .grow { transform-box: fill-box; transform-origin: 50% 50%; } .grow { transform-origin: left center; }
  @keyframes show { 0% { opacity: 0 } 2%, 18% { opacity: 1 } 20%, 100% { opacity: 0 } }
  @keyframes reveal { 0%, 3% { transform: scaleX(1) } 11%, 100% { transform: scaleX(0) } }
  @keyframes pop { 0% { opacity: 0; transform: scale(.4) } 3% { opacity: 1; transform: scale(1) } 16% { opacity: 1 } 17%, 100% { opacity: 0 } }
  @keyframes aiPop { 0% { opacity: 0; transform: scale(0) } 3% { opacity: 1; transform: scale(1.1) } 5% { transform: scale(1) } 6% { opacity: 1 } 8%, 100% { opacity: 0 } }
  @keyframes pulse { 0%, 13% { transform: scale(1) } 14% { transform: scale(.94) } 15%, 100% { transform: scale(1) } }
  @keyframes tabOn { 0%, 3% { stroke: #2a2f3a } 4%, 100% { stroke: #5b8cff } }
  @keyframes pillOn { 0%, 3% { stroke: #2a2f3a } 4%, 100% { stroke: #5b8cff } }
  @keyframes growY { 0% { transform: scaleY(0) } 2%, 100% { transform: scaleY(1) } }
  @keyframes growX { 0% { transform: scaleX(0) } 8%, 17% { transform: scaleX(var(--w)) } 18%, 100% { transform: scaleX(0) } }
  @keyframes slide { 0%, 5% { transform: translateX(0) } 12%, 100% { transform: translateX(var(--dx)) } }
</style>
